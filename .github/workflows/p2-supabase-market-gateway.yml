name: P2 Supabase Market Gateway

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/p2-supabase-market-gateway.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: python scripts/patch_market_price_supabase.py
      - run: node --check js/app.js
      - run: git diff --check
      - run: grep -q "functions/v1/market-prices" js/app.js
      - run: grep -q "시세 게이트웨이 실패" js/app.js
      - run: grep -q "Supabase → Yahoo" js/app.js

      - name: Commit frontend gateway patch
        run: |
          rm .github/workflows/p2-supabase-market-gateway.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js .github/workflows/p2-supabase-market-gateway.yml
          git commit -m "fix: route market prices through Supabase gateway"
          git push origin HEAD:main
