name: Supabase Keepalive

on:
  schedule:
    - cron: '17 0,8,16 * * *' # 09:17 / 17:17 / 01:17 KST
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/supabase-keepalive.yml

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Supabase database activity
        shell: bash
        run: |
          KEY=$(python - <<'PY'
          import re
          text=open('js/supabase.js', encoding='utf-8').read()
          m=re.search(r'const SUPABASE_ANON_KEY = "([^"]+)"', text)
          if not m:
              raise SystemExit('SUPABASE_ANON_KEY not found')
          print(m.group(1))
          PY
          )

          check_2xx() {
            case "$1" in
              2??) return 0 ;;
              *) echo "Unexpected HTTP status: $1"; return 1 ;;
            esac
          }

          RPC_BODY=$(mktemp)
          RPC_STATUS=$(curl -sS --max-time 15 -o "$RPC_BODY" -w "%{http_code}" \
            -X POST "https://xbyaoqswxqpketnyypar.supabase.co/rest/v1/rpc/keep_alive" \
            -H "Content-Type: application/json" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            --data '{}')

          echo "RPC_HTTP_STATUS=$RPC_STATUS"
          cat "$RPC_BODY"
          echo
          check_2xx "$RPC_STATUS"

          # Supabase's Free Plan pausing logic looks for sufficient user DB activity.
          # Exercise a real RLS-protected table read as well as the lightweight RPC.
          # With the anon role, trades rows remain hidden by RLS.
          TABLE_BODY=$(mktemp)
          TABLE_STATUS=$(curl -sS --max-time 15 -o "$TABLE_BODY" -w "%{http_code}" \
            "https://xbyaoqswxqpketnyypar.supabase.co/rest/v1/trades?select=id&limit=1" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY")

          echo "TABLE_HTTP_STATUS=$TABLE_STATUS"
          cat "$TABLE_BODY"
          echo
          check_2xx "$TABLE_STATUS"
