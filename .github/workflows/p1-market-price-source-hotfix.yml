name: P1 Market Price Source Hotfix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/p1-market-price-source-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python scripts/patch_market_price_source.py
      - run: node --check js/app.js
      - run: git diff --check
      - run: |
          grep -q "api.cors.lol/?url=" js/app.js
          grep -q "returnedSymbol === ySymbol" js/app.js
      - run: |
          rm .github/workflows/p1-market-price-source-hotfix.yml
          rm scripts/patch_market_price_source.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js .github/workflows/p1-market-price-source-hotfix.yml scripts/patch_market_price_source.py
          git commit -m "fix: restore production market quote source"
          git push origin HEAD:main
