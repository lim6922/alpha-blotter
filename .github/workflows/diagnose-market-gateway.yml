name: Diagnose Market Gateway

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-market-gateway.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Call Supabase market gateway
        shell: bash
        run: |
          KEY=$(python - <<'PY'
          import re
          text=open('js/supabase.js', encoding='utf-8').read()
          m=re.search(r'const SUPABASE_ANON_KEY = "([^"]+)"', text)
          if not m:
              raise SystemExit('SUPABASE_ANON_KEY not found')
          print(m.group(1))
          PY
          )
          BODY_FILE=$(mktemp)
          STATUS=$(curl -sS --max-time 15 -o "$BODY_FILE" -w "%{http_code}" \
            -X POST "https://xbyaoqswxqpketnyypar.supabase.co/functions/v1/market-prices" \
            -H "Origin: https://lim6922.github.io" \
            -H "Content-Type: application/json" \
            -H "apikey: $KEY" \
            --data '{"symbols":["KRW=X","MES=F","MNQ=F","MCL=F"]}')
          echo "HTTP_STATUS=$STATUS"
          echo "RESPONSE_BODY_START"
          cat "$BODY_FILE"
          echo
          echo "RESPONSE_BODY_END"
          test "$STATUS" = "200"

# rerun: publishable-key-diagnosis
