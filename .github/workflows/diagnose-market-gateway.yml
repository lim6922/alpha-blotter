name: Finalize Market Gateway

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-market-gateway.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify gateway returns all four quotes
        shell: bash
        run: |
          KEY=$(python - <<'PY'
          import re
          text=open('js/supabase.js', encoding='utf-8').read()
          m=re.search(r'const SUPABASE_ANON_KEY = "([^"]+)"', text)
          if not m:
              raise SystemExit('SUPABASE_ANON_KEY not found')
          print(m.group(1))
          PY
          )
          BODY_FILE=$(mktemp)
          STATUS=$(curl -sS --max-time 15 -o "$BODY_FILE" -w "%{http_code}" \
            -X POST "https://xbyaoqswxqpketnyypar.supabase.co/functions/v1/market-prices" \
            -H "Origin: https://lim6922.github.io" \
            -H "Content-Type: application/json" \
            -H "apikey: $KEY" \
            --data '{"symbols":["KRW=X","MES=F","MNQ=F","MCL=F"]}')
          cat "$BODY_FILE"
          test "$STATUS" = "200"
          grep -q '"received":4' "$BODY_FILE"

      - name: Bust browser cache and remove diagnostic workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          text = text.replace('src="js/supabase.js"', 'src="js/supabase.js?v=20260916-p2"')
          text = text.replace('src="js/app.js"', 'src="js/app.js?v=20260916-p2"')
          p.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/diagnose-market-gateway.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/diagnose-market-gateway.yml
          git commit -m "fix: finalize Supabase market gateway rollout"
          git push origin HEAD:main
